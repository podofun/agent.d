name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "npm/**/*.test.mjs"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The native shell sandbox has cfg-gated backends (Linux Landlock above;
  # macOS Seatbelt and Windows AppContainer here). Build and test the shell
  # crate on each OS so the per-platform backend compiles and its tests run on
  # the native runner.
  sandbox-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Test shell crate (sandbox backend)
        run: cargo test -p agentd-shell

  # Build the runtime image and boot it against the example userland so the
  # Dockerfile can't silently rot. The container marks itself healthy only
  # after /health answers 200.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: agentd:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot and wait for /health
        run: |
          docker run -d --name agentd -p 7777:7777 \
            -v "$PWD/examples/docker:/etc/agentd:ro" agentd:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7777/health; then ok=1; break; fi
            sleep 1
          done
          if [ -z "${ok:-}" ]; then
            echo "daemon never became healthy"; docker logs agentd; exit 1
          fi

      # The mounted userland must be loaded, not merely parsed: call an action
      # that lives in a file init.lua import()s.
      - name: Call an action from the mounted userland
        run: |
          docker exec agentd agentctl call greet -j '{"name":"ci"}' | tee /tmp/greet.json
          grep -q "hello, ci" /tmp/greet.json
