name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: agentd-x86_64-linux.tar.gz
            npm_platform: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: agentd-aarch64-macos.tar.gz
            npm_platform: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: agentd-x86_64-macos.tar.gz
            npm_platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: agentd-x86_64-windows.zip
            npm_platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p daemon -p agentd-cli

      # Windows-only helper; built and shipped only in the Windows archive.
      - name: Build network broker (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p agentd-netbroker

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/agentd target/${{ matrix.target }}/release/agentctl dist/
          cp README.md LICENSE dist/
          tar -czf "${{ matrix.archive }}" -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/agentd.exe dist/
          Copy-Item target/${{ matrix.target }}/release/agentctl.exe dist/
          # Ships alongside agentd.exe; the daemon locates it in its own folder.
          Copy-Item target/${{ matrix.target }}/release/agentd-netbroker.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage and pack the native npm package
        shell: bash
        run: |
          node npm/scripts/stage.mjs ${{ matrix.npm_platform }} target/${{ matrix.target }}/release dist/npm-native
          mkdir -p dist/npm
          npm pack ./dist/npm-native --pack-destination dist/npm

      # Install the freshly packed launcher + native tarballs into a scratch
      # prefix and run the real binary through the shim, on this runner's OS.
      # --offline makes npm skip the three optional deps that don't exist yet
      # instead of failing on them. --force lets npm install a package whose
      # os/cpu gate doesn't match the runner, which the darwin-x64 row needs:
      # it builds on an arm64 Mac and the binary runs under Rosetta. Nothing
      # else is in play for --force to override in an offline two-tarball
      # install.
      - name: Smoke test the packed packages
        shell: bash
        run: |
          node npm/scripts/stage.mjs cli - dist/npm-cli
          mkdir -p dist/smoke-pack dist/smoke
          npm pack ./dist/npm-cli --pack-destination dist/smoke-pack
          npm install --prefix dist/smoke --offline --no-audit --no-fund --force ./dist/npm/*.tgz ./dist/smoke-pack/*.tgz
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          out="$(node dist/smoke/node_modules/@podofun/agentd/bin/agentd.js --version)"
          echo "$out"
          [ "$out" = "agentd $version" ]
          out="$(node dist/smoke/node_modules/@podofun/agentd/bin/agentctl.js --version)"
          echo "$out"
          [ "$out" = "agentctl $version" ]

      - name: Upload native npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm_platform }}
          path: dist/npm/*.tgz

  draft:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Verify existing release tag
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG already points to another commit. Bump the workspace version."
              exit 1
            fi
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

  # Publish the runtime image. Same gate as `build`: only from main, and only
  # on a [release] commit or a manual dispatch.
  docker:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: without the secrets the step is skipped and
      # only the ghcr.io tags are pushed.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_REPO != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          minor="${VERSION%.*}"
          # Prereleases (0.8.3-alpha) get the exact version only: they must not
          # move `latest` or the shared minor tag.
          case "$VERSION" in
            *-*) names="$VERSION" ;;
            *)   names="$VERSION $minor latest" ;;
          esac
          repos="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_REPO" ]; then
            repos="$repos $DOCKERHUB_REPO"
          fi
          tags=""
          for repo in $repos; do
            for name in $names; do
              tags="${tags:+$tags,}$repo:$name"
            done
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish the launcher and the four native packages. Natives go first so the
  # launcher never references a version that is not on the registry yet.
  # Authentication is npm trusted publishing (OIDC): no token in secrets.
  npm-publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Read workspace version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts/npm
          merge-multiple: true

      - name: Stage and pack the launcher
        run: |
          node npm/scripts/stage.mjs cli - dist/npm-cli
          mkdir -p artifacts/launcher
          npm pack ./dist/npm-cli --pack-destination artifacts/launcher

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          natives=(artifacts/npm/*.tgz)
          if [ "${#natives[@]}" -ne 4 ]; then
            echo "::error::Expected 4 native tarballs, found ${#natives[@]}"; ls artifacts/npm; exit 1
          fi
          for f in "${natives[@]}"; do
            npm publish "./$f" --provenance --access public --tag "$tag"
          done
          npm publish ./artifacts/launcher/*.tgz --provenance --access public --tag "$tag"
