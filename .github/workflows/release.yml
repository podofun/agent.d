name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: agentd-x86_64-linux.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: agentd-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: agentd-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release -p daemon -p agentd-cli

      # Windows-only helper; built and shipped only in the Windows archive.
      - name: Build network broker (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p agentd-netbroker

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/agentd target/release/agentctl dist/
          cp README.md LICENSE dist/
          tar -czf "${{ matrix.archive }}" -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/agentd.exe dist/
          Copy-Item target/release/agentctl.exe dist/
          # Ships alongside agentd.exe; the daemon locates it in its own folder.
          Copy-Item target/release/agentd-netbroker.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  draft:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Verify existing release tag
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG already points to another commit. Bump the workspace version."
              exit 1
            fi
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

  # Publish the runtime image. Same gate as `build`: only from main, and only
  # on a [release] commit or a manual dispatch.
  docker:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: without the secrets the step is skipped and
      # only the ghcr.io tags are pushed.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_REPO != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          minor="${VERSION%.*}"
          # Prereleases (0.8.3-alpha) get the exact version only: they must not
          # move `latest` or the shared minor tag.
          case "$VERSION" in
            *-*) names="$VERSION" ;;
            *)   names="$VERSION $minor latest" ;;
          esac
          repos="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_REPO" ]; then
            repos="$repos $DOCKERHUB_REPO"
          fi
          tags=""
          for repo in $repos; do
            for name in $names; do
              tags="${tags:+$tags,}$repo:$name"
            done
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
