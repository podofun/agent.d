# agentd daemon config. CLI flags + env vars override.
# Drop a copy of this at $XDG_CONFIG_HOME/agentd/config.toml and edit.

[daemon]
# WebSocket + HTTP /health bind address.
addr = "127.0.0.1:7777"
# JSONL trace sink path. `~` expands to your home directory.
trace_file = "~/.local/state/agentd/trace.jsonl"
# tracing-subscriber filter.
# Examples: "info", "agentd_executor=debug,warn", "trace".
log_level = "warn"
# Bearer token clients must present on the /ws handshake. If omitted (and
# no_auth is false), the daemon mints one at startup and writes it to
# ~/.local/state/agentd/token, which agentctl reads automatically.
# token = "paste-a-long-random-string"
# Set true to disable /ws auth entirely (any local client may connect).
# /health is always open regardless. Also opens /control.
no_auth = false
# Bearer token for the privileged /control plane (operator management +
# interactive permission approvals). Distinct from `token` so a public-token
# holder can never reach control. If omitted (and no_auth is false), the daemon
# mints one at startup and writes it to ~/.local/state/agentd/admin-token,
# which `agentctl grants listen` reads automatically.
# admin_token = "paste-a-different-long-random-string"
# How long (ms) an escalated permission request waits for an operator verdict
# before failing closed (deny). Default 120000.
approval_timeout_ms = 120000
# Where the daemon reads secrets from. "keyring" (the default) uses the OS
# keyring. In containers, use "env" (AGENTD_SECRET_<NAME> variables) or
# "dir:/run/secrets" (one file per secret, the shape of Docker/Kubernetes
# secret mounts) — both are read-only; the platform provides the values.
# secrets = "keyring"

# This route receives `POST /webhooks/events`.
# `secret` identifies an OS-keyring entry.
# The header fields define the HMAC-SHA256 signature format.
#
# [webhooks.events]
# action = "events.ingest"
# secret = "webhook_secret"
# signature_header = "x-webhook-signature-256"
# signature_prefix = "sha256="
# id_header = "x-webhook-id"

[runtime]
# Lua entry point. Absolute path or `~/...`.
init = "~/.config/agentd/init.lua"
# Tool-use loop cap per runner call (ExecutorOwned providers).
max_turns = 16
# NOTE: reserved. Setting this to true today emits a warning and is
# otherwise ignored.
yolo = false
# Provider used when a model string has no `provider/` prefix. Any built-in
# or [providers.<name>] entry. Default "anthropic".
# default_provider = "ollama"

# Custom providers: any OpenAI- or Anthropic-compatible endpoint becomes a
# named prefix. `kind` picks the wire format ("openai" | "anthropic").
# `base_url` is forgiving: with or without the /chat/completions suffix.
# Auth is explicit: either `api_key_secret` (key name in the secret store) or
# `auth = "none"` for local servers without authentication.
#
# `api_key_secret` names a key in the secret store, seeded once with
# `agentctl secret set`, e.g.:
#   echo "$OPENROUTER_API_KEY" | agentctl secret set openrouter_api_key

# [providers.openrouter]
# kind = "openai"
# base_url = "https://openrouter.ai/api/v1"
# api_key_secret = "openrouter_api_key"
# default_model = "meta-llama/llama-3.3-70b-instruct"

# [providers.groq]
# kind = "openai"
# base_url = "https://api.groq.com/openai/v1"
# api_key_secret = "groq_api_key"

# [providers.ollama]
# kind = "openai"
# base_url = "http://localhost:11434/v1"
# auth = "none"
# default_model = "qwen3:14b"
